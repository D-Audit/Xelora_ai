name: Build Desktop Installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The auto-updater compares the version inside the app, not the tag:
      # a v1.4.3 tag built from package.json 1.4.2 is never offered as an
      # update. Refuse to release when they disagree.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match desktop/package.json version $version. Bump the version before tagging."
          }

      - name: Install dependencies
        run: npm install

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Bundle the local agent (Python runtime + backend)
        shell: pwsh
        run: ./scripts/bundle-agent.ps1

      # Code signing (docs/CODE_SIGNING.md). Set the repository variable
      # XELORA_SIGN_PROVIDER=azure and the AZURE_* secrets to sign releases;
      # set XELORA_REQUIRE_SIGNING=true to refuse to publish unsigned builds.
      - name: Install Azure Trusted Signing client
        if: vars.XELORA_SIGN_PROVIDER == 'azure'
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory "$env:RUNNER_TEMP\trusted-signing" -NonInteractive
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\trusted-signing" -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll was not found in the NuGet package." }
          "AZURE_SIGN_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer (NSIS)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XELORA_SIGN_PROVIDER: ${{ vars.XELORA_SIGN_PROVIDER }}
          XELORA_REQUIRE_SIGNING: ${{ vars.XELORA_REQUIRE_SIGNING }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xelora-windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: error

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/latest.yml
