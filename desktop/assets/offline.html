<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xelora — Connecting…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, Geist, system-ui, sans-serif;
      background: #001E2B;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
      padding: 32px;
      text-align: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
    }
    .logo-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      max-width: 400px;
      line-height: 1.6;
    }
    .steps {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 20px 24px;
      text-align: left;
      max-width: 400px;
      width: 100%;
    }
    .steps p { color: rgba(255,255,255,0.5); font-size: 12px; margin-bottom: 12px; }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }
    .step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00684A;
      color: white;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    button {
      background: #00684A;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #023430; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ED64;
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 36 36" fill="none">
      <rect x="1" y="1" width="15" height="15" rx="2" fill="#023430"/>
      <rect x="20" y="1" width="15" height="15" rx="2" fill="#00684A"/>
      <rect x="1" y="20" width="15" height="15" rx="2" fill="#00684A"/>
      <rect x="20" y="20" width="15" height="15" rx="2" fill="#023430"/>
      <line x1="5" y1="5" x2="12" y2="12" stroke="#00ED64" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="12" y1="5" x2="5" y2="12" stroke="#00ED64" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="24" y1="24" x2="31" y2="31" stroke="#00ED64" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="31" y1="24" x2="24" y2="31" stroke="#00ED64" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <span class="logo-name">Xelora</span>
  </div>

  <div>
    <h1><span class="dot"></span>Connecting to Xelora Web…</h1>
    <p style="margin-top:8px">The desktop app needs the Xelora web server running on your machine to load.</p>
  </div>

  <div class="steps">
    <p>TO GET STARTED</p>
    <div class="step"><span class="step-num">1</span><span>Open a terminal in the <strong>xelora</strong> folder</span></div>
    <div class="step"><span class="step-num">2</span><span>Run <strong>npm run dev</strong> to start the web server</span></div>
    <div class="step"><span class="step-num">3</span><span>Click Retry below once the server is running on port 3000</span></div>
  </div>

  <button onclick="window.location.href='http://localhost:3000/desktop'">
    Retry connection
  </button>
</body>
</html>
